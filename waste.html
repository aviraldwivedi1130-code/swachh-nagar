<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSync OS — Smart Waste & Fleet Management System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars & smooth animations */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    @keyframes truck-drive {
      0% { transform: translate(10px, 15px); }
      25% { transform: translate(120px, 45px); }
      50% { transform: translate(240px, 20px); }
      75% { transform: translate(360px, 90px); }
      100% { transform: translate(10px, 15px); }
